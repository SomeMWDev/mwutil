[package]
name = "mwutil-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mwutil-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
clap_complete = { version = "4.5.62", features = ["unstable-dynamic"] }
console = "0.16.2"
dotenv = "0.15.0"
serde_json = "1.0.148"
regex = "1.12.2"
indicatif = "0.18.3"
dialoguer = "0.12.0"
rand = "0.9.2"
