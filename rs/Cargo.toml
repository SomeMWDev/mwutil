[package]
name = "mwutil"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mwutil"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = { version = "4.5.66", features = ["unstable-dynamic"] }
console = "0.16.2"
dotenv = "0.15.0"
regex = "1.12.3"
indicatif = "0.18.3"
dialoguer = "0.12.0"
rand = "0.9.2"
strum = { version = "0.27.2", features = ["derive"] }
notify = "8.2.0"
cli-clipboard = "0.4.0"
